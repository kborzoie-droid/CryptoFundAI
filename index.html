<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Fund AI</title>
<style>
body{background:#0b1020;color:white;font-family:Arial;text-align:center;padding:20px}
.card{background:#121a2b;padding:20px;margin:15px auto;border-radius:15px;max-width:400px}
.price{font-size:28px;color:#5da9ff}
</style>
</head>

<body>

<h1>Crypto Fund AI</h1>
<p>📊 قیمت لحظه‌ای بازار</p>

<div class="card">
<h2>₿ Bitcoin</h2>
<div id="btc" class="price">در حال دریافت...</div>
</div>

<div class="card">
<h2>♦ Ethereum</h2>
<div id="eth" class="price">در حال دریافت...</div>
</div>

<p id="status">در حال اتصال به بازار...</p>

<script>
fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd")
.then(r=>r.json())
.then(d=>{
document.getElementById("btc").innerText="$"+d.bitcoin.usd.toLocaleString();
document.getElementById("eth").innerText="$"+d.ethereum.usd.toLocaleString();
document.getElementById("status").innerText="🟢 اتصال برقرار است";
})
.catch(()=>{
document.getElementById("status").innerText="🔴 خطا در اتصال";
});
</script>

</body>
</html>
